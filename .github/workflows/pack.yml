name: Build Mod Package
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  TARGET_PLATFORM: windows
  TARGET_ARCH: x64
  # Reserved, disabled targets: windows_arm, macos_x64, macos_arm, linux_x64, linux_arm.
  MOD_NAME: NativeInteractions
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve package name
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"; suffix=""
          else
            version="$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
            if [[ -z "$version" ]]; then
              version="$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]' | head -n1)"
            fi
            version="${version#v}"
            if [[ -z "$version" ]]; then
              version="$(sed -n 's/.*ModVersion = "\([^"]*\)".*/\1/p' modules/ui/baseUI.lua | head -n1)"
            fi
            version="${version:-0.0.0}"
            patch="$(git rev-list --count --since="$(date -u +%Y-%m-01T00:00:00Z)" HEAD)"
            suffix="_$(date -u +%Y).$((10#$(date -u +%m))).${patch:-1}"
          fi
          artifact="${MOD_NAME}_v${version}_${TARGET_PLATFORM}_${TARGET_ARCH}${suffix}.zip"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Build package
        shell: bash
        run: |
          mod_dir=stage/bin/x64/plugins/cyber_engine_tweaks/mods/nativeInteractions
          mkdir -p stage/archive/pc/mod stage/r6/scripts "$mod_dir" stage/bin/x64/plugins/cyber_engine_tweaks/mods/entSpawner/data
          cp -R favorite stage/bin/x64/plugins/cyber_engine_tweaks/mods/entSpawner/data/
          cp nativeInteractions.archive archive/resources/nativeInteractions.xl stage/archive/pc/mod/
          cp -R r6/* stage/r6/
          cp -R projects modules init.lua "$mod_dir/"
          cd stage && zip -9 -r "../${{ steps.meta.outputs.artifact }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.meta.outputs.artifact }}" --draft --generate-notes --verify-tag
